name: Release candidate builds

on:
  workflow_dispatch:
  push:
    branches: [feat/automatic-updates]

permissions:
  contents: read

jobs:
  showdex:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:showdex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-showdex
          path: vendor/showdex/dist/
          retention-days: 14
  package:
    needs: showdex
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
            id: Windows-x64
          - runner: macos-15
            platform: mac
            arch: arm64
            id: macOS-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            id: macOS-x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            id: Linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libfuse2t64
      - run: npm run check
      - run: npm test
      - run: npm run build:practice
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pinned-showdex
          path: vendor/showdex/dist/
      - name: Build native packages
        run: npm run pack:${{ matrix.platform }} -- --${{ matrix.arch }}
      - name: Save packages for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.id }}
          path: |
            out/windows/*.exe
            out/windows/*.blockmap
            out/windows/latest.yml
            out/macos/*.dmg
            out/macos/*.zip
            out/linux/*.AppImage
            out/linux/*.tar.gz
            out/linux/latest-linux.yml
          compression-level: 0
          retention-days: 14
