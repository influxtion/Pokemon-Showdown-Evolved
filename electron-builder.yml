appId: com.influxtion.showdowndesktop
productName: Pokemon Showdown Evolved
publish:
  provider: github
  owner: influxtion
  repo: Pokemon-Showdown-Launcher-App
  releaseType: prerelease
directories:
  output: out/windows
asar: true
# runAsNode stays on: the practice simulator runs as an ELECTRON_RUN_AS_NODE child.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Python reads the Foul Play worker directly, so it cannot live inside app.asar.
asarUnpack:
  - api/worker/**/*
  - api/metamon/worker.py
beforePack: scripts/verify-practice-package.js
afterPack: scripts/verify-practice-package-after.js
extraResources:
  - from: vendor/practice/dist
    to: practice
    filter:
      - '**/*'
  - from: scripts/practice
    to: practice-adapter
    filter:
      - server.cjs
files:
  - LICENSE
  - app/**/*
  - renderer/**/*
  # Foul Play plays on the cloud server by default. For players who opt in to running it on their
  # computer, the installer, its pins, the local server and the worker script ship too (checked by
  # scripts/verify-practice-package.js); Foul Play itself is downloaded only when they ask.
  - api/client.js
  - api/protocol.js
  - api/install.js
  - api/server.js
  - api/resources.js
  - api/lock.json
  - api/worker/foulplay_worker.py
  # Only the optional installer, adapter and notices. Models/runtimes download on request.
  - api/metamon/install.js
  - api/metamon/lock.json
  - api/metamon/requirements.txt
  - api/metamon/bootstrap.txt
  - api/metamon/worker.py
  - api/metamon/CODE-LICENSE
  - api/metamon/MODEL-LICENSE
  - api/metamon/MODEL-CARD
  - api/metamon/ATTRIBUTION.txt
  - vendor/showdex/LICENSE
  - vendor/showdex/SOURCE.md
  - vendor/showdex/manifest.json
  # Inert install payload; copied and enabled only after the player's explicit choice.
  - vendor/showdex/dist/**/*
  - '!app/**/*.test.js'
  - '!app/**/tests/**'
win:
  icon: renderer/assets/app.ico
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: renderer/assets/app.ico
  uninstallerIcon: renderer/assets/app.ico
  installerHeaderIcon: renderer/assets/app.ico
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  artifactName: Pokemon.Showdown.Evolved.Setup.${version}-${arch}.${ext}
mac:
  icon: renderer/assets/logo.png
  category: public.app-category.games
  identity: '-'
  hardenedRuntime: false
  notarize: false
  artifactName: Pokemon.Showdown.Evolved.${version}.macOS-${arch}.${ext}
  target:
    - dmg
    - zip
linux:
  icon: renderer/assets/logo.png
  category: Game
  executableName: pokemon-showdown-evolved
  artifactName: Pokemon.Showdown.Evolved.${version}.Linux-${arch}.${ext}
  target:
    - AppImage
    - tar.gz
